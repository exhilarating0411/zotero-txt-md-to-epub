name: Build and publish XPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and manifest version must match.' }
          if (!(Test-Path "releases/$version.md")) { throw 'Release notes are missing.' }
          ./build.ps1
      - name: Publish release and installation asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          $body = @{ tag_name = "v$version"; target_commitish = $env:GITHUB_SHA; name = "v$version - GitBook and TXT/Markdown to EPUB"; body = (Get-Content "releases/$version.md" -Raw -Encoding utf8); draft = $true; prerelease = $false } | ConvertTo-Json
          $release = Invoke-RestMethod -Method Post -Uri $api -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body))
          $name = "txt-md-to-epub-for-zotero-$version.xpi"
          $asset = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) $name
          $upload = $release.upload_url.Split('{')[0] + '?name=' + [Uri]::EscapeDataString($name)
          Invoke-RestMethod -Method Post -Uri $upload -Headers $headers -ContentType 'application/x-xpinstall' -InFile $asset | Out-Null
          Invoke-RestMethod -Method Patch -Uri "$api/$($release.id)" -Headers $headers -ContentType 'application/json' -Body '{"draft":false}' | Out-Null
          Write-Output "Published $($release.html_url)"
