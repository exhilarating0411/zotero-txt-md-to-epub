<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title>GitBook to EPUB</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { margin: 24px; }
    h1 { font-size: 20px; margin: 0 0 22px; }
    label { display: block; margin: 14px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 8px; font: inherit; }
    progress { width: 100%; height: 16px; margin-top: 18px; }
    #destination, #status { overflow-wrap: anywhere; }
    #status { white-space: pre-wrap; min-height: 65px; max-height: 180px; overflow: auto; }
    footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    button { font: inherit; padding: 7px 18px; }
  </style>
</head>
<body>
  <h1 id="heading">GitBook to EPUB</h1>
  <div id="destination"></div>
  <form id="form">
    <label id="url-label" for="url">Course URL</label>
    <input id="url" type="url" required="required" placeholder="https://example.gitbook.io/course/"/>
    <label id="title-label" for="title">Book title (optional)</label>
    <input id="title" type="text" maxlength="160"/>
    <progress id="progress" value="0" max="1"></progress>
    <div id="status" role="status" aria-live="polite"></div>
    <footer><button id="cancel" type="button">Close</button><button id="start" type="submit">Import</button></footer>
  </form>
  <script type="application/javascript" src="chrome://txt-md-to-epub/content/course-dialog.js"></script>
</body>
</html>
